name: Source checks
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed pin
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Offline strict tests
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Localization and release guards
        run: |
          python3 scripts/check-localization.py
          python3 scripts/test-public-source.py
          python3 scripts/test-release-safety.py
          python3 scripts/check-release-safety.py
          python3 scripts/public-source.py check
      - name: Compile only, no installation or launch
        run: bash scripts/build-lyric-preview.sh
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed pin
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned scanner in runner temp
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Redacted local scan, no uploaded report
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: bash scripts/scan-secrets.sh
