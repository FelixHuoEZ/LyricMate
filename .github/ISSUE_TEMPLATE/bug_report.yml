name: Bug report / 缺陷反馈
description: Minimal redacted reproduction, not security or account data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach personal settings, backups, playback histories, private URLs, unredacted logs, tokens, cookies or full lyrics.
        Vulnerabilities belong in the private channel described in SECURITY.md, not in this form.
        请只提交脱敏步骤，不上传配置、播放记录、凭据或完整歌词。
  - type: input
    id: version
    attributes:
      label: Version and commit / 版本与提交
      placeholder: Source Alpha, commit prefix
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and chip / 系统与芯片
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction / 合成复现步骤
      description: Describe expected vs actual behavior and error category. No raw diagnostic bundle.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review / 隐私核对
      options:
        - label: I reviewed the text and attachments; no personal data, secrets or full lyrics are included.
          required: true
